<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Minecraft Account</title>
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet" />

    <!-- Bootstrap CSS CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
    />
    <style>
      html, body {
        height: 100vh;
        overflow: hidden;
      }
      .container {
        margin: 0!important;
        font-family: 'Minecraft';
      }
      body {
        background-image: url("/images/minecraft-bg.png");
        background-color: black;
      }
      .card {
        background-color: #303030;
      }
      .minecraft-text {
        font-family: 'Minecraft';
      }
    </style>
  </head>

  <body>
    <img
      src="/images/minecraft-java-logo.png"
      alt=""
      class="mx-auto text-center d-flex justify-content-center my-5 col-8"
    />
    <div
      class="d-flex align-items-center justify-content-center text-white w-100"
    >
      <div class="container text-center p-0">
        <div class="card text-white pt-3 shadow border-0 mt-5 shadow-lg">
          <h2 id="status-title">Checking Status...</h2>
          <p id="status-message"></p>

          <div id="minecraft-link-container" class="d-none">
            <ol class="text-start minecraft-text fw-lighter ms-2">
              <li class="mb-4">Connect your Discord account.</li>
              <li>Connect to ZLG Minecraft.</li>
              <li class="mb-2 mt-4">
                Type
                <img class="rounded-3" src="/images/discord-link.png" alt="" />
                in the in-game chat
              </li>
              <li>
                Copy the code and send it to
                <img
                  src="/images/lynx-bot.png"
                  alt=""
                  class="ms-2 border border-dark rounded-3"
                />
              </li>
            </ol>
            <button
              id="link-minecraft-btn"
              class="btn btn-primary my-3 mx-auto"
            >
              Link Minecraft
            </button>
          </div>

          <div id="minecraft-info-container" class="d-none">
            <h3 class="text-success">✅ Minecraft Linked Successfully</h3>
            <p class="mb-3">Username: <strong id="mc-username"></strong></p>
            <img
              id="mc-avatar"
              class="rounded mt-2"
              src=""
              alt="Minecraft Avatar"
              width="80"
              height="80"
            />
          </div>
        </div>
      </div>
    </div>

    <script>
      async function checkMinecraftStatus() {
        const token = localStorage.getItem("authToken");
        if (!token) {
          document.getElementById("status-title").innerText = "No Discord Linked";
          document.getElementById("status-message").innerText = "Please link your Discord account to continue.";
          return;
        }

        try {
          const res = await fetch("/api/Minecraft/linked", {
            method: "GET",
            headers: { Authorization: "Bearer " + token }
          });

          const data = await res.json();
          if (!data || !data.minecraftUuid) {
            document.getElementById("status-title").innerText = "Link Your Minecraft Account";
            document.getElementById("minecraft-link-container").classList.remove("d-none");
            const linkBtn = document.getElementById("link-minecraft-btn");
            linkBtn.removeEventListener("click", linkMinecraft); // Ensure no duplicate event bindings
            linkBtn.addEventListener("click", linkMinecraft);

          } else {
            document.getElementById("status-title").innerText = "Minecraft Linked Successfully";
            document.getElementById("mc-username").innerText = data.minecraftUsername || "Unknown";
            document.getElementById("mc-avatar").src = data.minecraftAvatarUrl || "https://mc-heads.net/avatar/Steve.png";

            document.getElementById("minecraft-info-container").classList.remove("d-none");

            // Send data back to parent window and auto-close after 5 seconds
            window.opener.postMessage({
              type: "MINECRAFT_AUTH_SUCCESS",
              minecraftUuid: data.minecraftUuid,
              minecraftUsername: data.minecraftUsername,
              minecraftAvatarUrl: data.minecraftAvatarUrl
            }, window.location.origin);

            setTimeout(() => window.close(), 5000);
          }
        } catch (err) {
          console.error("❌ Error checking Minecraft status:", err);
          document.getElementById("status-title").innerText = "Error";
          document.getElementById("status-message").innerText = "Something went wrong.";
        }
      }

      async function linkMinecraft() {
        try {
          const token = localStorage.getItem("authToken");
          const res = await fetch("/api/Minecraft/link-minecraft", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token
            }
          });

          if (res.ok) {
            location.reload();
          } else {
            alert("Failed to link Minecraft.");
          }
        } catch (err) {
          console.error("❌ Error linking Minecraft:", err);
        }
      }

      checkMinecraftStatus();
    </script>
  </body>
</html>
